schema: spec-driven

context: |
  ## Project: SAP AI Provider for Vercel AI SDK

  TypeScript/Node.js library providing integration between SAP AI Core and Vercel AI SDK.
  Enables developers to use SAP's AI services through the standardized AI SDK interface.

  ### Tech Stack
  - Language: TypeScript (strict mode)
  - Runtime: Node.js 22.12+; Edge tests cover provider source logic, not deployment of published bundles without Node compatibility
  - Build: tsup (CommonJS + ESM + .d.ts)
  - Test: Vitest (node + edge configs)
  - Formatting: Prettier + ESLint

  ### Key Dependencies
  - Runtime: AI SDK provider contracts/utilities, SAP AI and Cloud SDKs, and Zod (exact packages and ranges in package.json)
  - Peer: ai (main package: ^5.0.0 || ^6.0.0 || ^7.0.0; standalone V2: ^5.0.0 || ^6.0.0)
  - Development: @ai-sdk/provider-v2 (official V2 types bundled into declarations, never a consumer dependency), ai 7; ai is not a direct runtime dependency

  ### Architecture Patterns
  - Two published packages: main package with root and identical /v3 (V3 / AI SDK 6), /v2 (V2 / AI SDK 5), /v4 (V4 / AI SDK 7), plus standalone -v2
  - V2 also supports AI SDK 6 compatibility; both facades share the V3 implementation
  - Package release versions, provider specifications (V2/V3/V4), and AI SDK majors (5/6/7) are independent
  - Uses zod schemas for validation
  - Lazy loading of SAP SDK strategies (the SDK packages are runtime dependencies)
  - Strategy Pattern for API abstraction
  - Preserve Node.js support and Edge-tested source behavior; Edge deployment remains a portability goal, while published bundles and SAP transport currently require Node-compatible APIs
  - Verify the published bundle and SAP transport on a target Edge runtime before claiming Edge deployment support

  ### Source Structure
  - src/index.ts - V3 public API exports (AI SDK 6 root and /v3 share the same artifacts)
  - src/index-v2.ts - V2 public API exports (AI SDK 5 facade; also AI SDK 6 compatibility)
  - src/index-v4.ts - V4 public API exports (AI SDK 7 facade)
  - src/sap-ai-provider-v4.ts - V4 provider factory (shared V3 settings and implementation)
  - src/sap-ai-language-model-v4.ts - V4 language model (wraps V3)
  - src/sap-ai-embedding-model-v4.ts - V4 embedding model (wraps V3)
  - src/sap-ai-adapters-v4-to-v3.ts - V4 prompt normalization
  - src/sap-ai-adapters-v3-to-v4.ts - V4 result and stream conversion
  - src/sap-ai-provider.ts - V3 provider factory
  - src/sap-ai-provider-v2.ts - V2 provider factory (wraps V3)
  - src/sap-ai-language-model.ts - V3 language model (LanguageModelV3)
  - src/sap-ai-language-model-v2.ts - V2 language model (wraps V3)
  - src/sap-ai-embedding-model.ts - V3 embedding model (EmbeddingModelV3)
  - src/sap-ai-embedding-model-v2.ts - V2 embedding model (wraps V3)
  - src/sap-ai-adapters-v3-to-v2.ts - V3→V2 format conversion
  - src/sap-ai-settings.ts - Types, settings, and SAP SDK re-exports
  - src/sap-ai-provider-options.ts - Zod schemas for provider options
  - src/sap-ai-validation.ts - API resolution and validation
  - src/sap-ai-error.ts - Error handling (UnsupportedFeatureError, ApiSwitchError)
  - src/sap-ai-strategy.ts - Strategy factory (lazy loading)
  - src/base-language-model-strategy.ts - Base language model strategy (Template Method)
  - src/base-embedding-model-strategy.ts - Base embedding model strategy (Template Method)
  - src/orchestration-language-model-strategy.ts - Orchestration API language model
  - src/orchestration-embedding-model-strategy.ts - Orchestration API embedding model
  - src/foundation-models-language-model-strategy.ts - Foundation Models API language model
  - src/foundation-models-embedding-model-strategy.ts - Foundation Models API embedding model
  - src/strategy-utils.ts - Shared strategy utilities
  - src/stream-transformer.ts - SAP stream lifecycle and V3 event conversion
  - src/convert-to-sap-messages.ts - Message format conversion
  - src/deep-merge.ts - Deep merge utility
  - src/version.ts - Package version constant

  ### Conventions
  - JSDoc comments required for all public APIs
  - Use Vercel AI SDK standard errors
  - Follow existing patterns in codebase
  - Tests mirror source file structure (*.test.ts)

  ### Build and CI
  - Run npm run check-lockfile-release-age before npm ci as a local candidate gate; it runs without node_modules, fetches canonical raw npm packuments without redirects, checks top-level time[version] plus exact version-manifest fingerprints, limits each decoded packument to 64 MiB, lockfiles to 2 MiB UTF-8, and selected artifacts to 1,024, uses eight concurrent 10-second complete requests with fail-fast aborts, and fails closed. Default comparison lockfile: 3f869c5f5371b35e53ef38bae2173541ab6c209a:package-lock.json. Only registry artifacts absent from that lockfile are age-validated; --all validates every artifact
  - npm ci installs dependencies and Lefthook hooks; build artifacts require npm run build
  - Main build emits V3/V2/V4 ESM, CommonJS, declarations, and sourcemaps; check-build verifies all artifacts and declaration routing
  - build:v2 cleans dist and replaces main outputs with V2-only artifacts; prepare:v2 rewrites manifests and renames artifacts for standalone publishing
  - PR/autofix CI release-age checks are non-authoritative candidate gates; the dedicated pull_request_target workflow runs only default-branch checker code, resolves exact head/base commits through the GitHub API, downloads only raw lockfiles as untrusted data without importing/checking out/executing the head, and publishes dependency-security/trusted-lockfile-release-age on the exact PR head, while its 30-minute push-main job is the trusted release prerequisite; release CI verifies that exact SHA and literal main branch workflow run and re-runs the checker. An external ruleset must require/restrict the exact status source, and an organization required workflow/Actions policy or dedicated App must prevent homonymous writers; it must protect trusted/release policy files. No external policy is asserted active
  - Dependency audit forces prod/dev/optional/peer scopes; from exact audit nodes it validates every lockfile-v3 edge up to the direct root anchor plus the identity coherence of every edge entering that anchor, while coherent shared references above it are not recursively treated as new provenance; npm 11 fixAvailable is the strict boolean/object union and literal true invalidates an exception
  - Edge excludes *.node.test.ts; CI has no Node-version or AI SDK-major matrix

  ### Validation Command
  npm run check-lockfile-release-age && npm run check-dependency-audit && npm run type-check && npm run test:node && npm run test:edge && npm run prettier-check && npm run lint && npm run build && npm run check-build && npm run build:v2 && npm run check-build:v2

