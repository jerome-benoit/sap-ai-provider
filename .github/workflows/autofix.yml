name: autofix.ci
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Attest new lockfile artifacts
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_SHA="$EVENT_BASE_SHA"
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if ! BASE_SHA=$(git merge-base "$GITHUB_SHA" origin/main); then
              echo "Unable to determine a base commit for first push $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "Missing base commit for lockfile release-age gate" >&2
            exit 1
          fi
          node scripts/check-lockfile-release-age.mjs "$BASE_SHA"
      - run: npm ci
      - run: npm run lint-fix
      - run: npm run prettier-fix
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # main
