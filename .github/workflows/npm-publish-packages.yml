name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify release commit gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
          CHECK_OK=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq 'any(.check_runs[]; .name == "Lockfile release age" and .conclusion == "success")')
          if [ "$CHECK_OK" != "true" ]; then
            echo "Release commit $GITHUB_SHA has no successful exact 'Lockfile release age' check run" >&2
            exit 1
          fi
      - name: Attest release artifacts against policy baseline
        run: npm run check-lockfile-release-age
      - name: Validate lockfile synchronization
        run: npm ci --dry-run --ignore-scripts
      - run: npm ci
      - name: Check dependency vulnerabilities
        run: npm run check-dependency-audit
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run build:v2
      - run: npm run test:node
      - run: npm run test:edge

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Set package version from release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version
      - name: Attest release artifacts against policy baseline
        run: npm run check-lockfile-release-age
      - run: npm ci
      - name: Determine npm tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" =~ -alpha ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "Publishing as 'alpha' tag for version $VERSION"
          elif [[ "$VERSION" =~ -beta ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "Publishing as 'beta' tag for version $VERSION"
          elif [[ "$VERSION" =~ -rc ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "Publishing as 'next' tag for release candidate $VERSION"
          elif [[ "$VERSION" =~ -canary ]]; then
            echo "tag=canary" >> $GITHUB_OUTPUT
            echo "Publishing as 'canary' tag for version $VERSION"
          elif [[ "$VERSION" =~ - ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "Publishing as 'next' tag for prerelease version $VERSION"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing as 'latest' tag for stable version $VERSION"
          fi
      - name: Simulate npm publish
        run: npm publish --dry-run --tag ${{ steps.tag.outputs.tag }}
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}

  publish-npm-v2:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Set package version from release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version
      - name: Attest release artifacts against policy baseline
        run: npm run check-lockfile-release-age
      - run: npm ci
      - name: Determine npm tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" =~ -alpha ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "Publishing as 'alpha' tag for version $VERSION"
          elif [[ "$VERSION" =~ -beta ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "Publishing as 'beta' tag for version $VERSION"
          elif [[ "$VERSION" =~ -rc ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "Publishing as 'next' tag for release candidate $VERSION"
          elif [[ "$VERSION" =~ -canary ]]; then
            echo "tag=canary" >> $GITHUB_OUTPUT
            echo "Publishing as 'canary' tag for version $VERSION"
          elif [[ "$VERSION" =~ - ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "Publishing as 'next' tag for prerelease version $VERSION"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing as 'latest' tag for stable version $VERSION"
          fi
      - name: Simulate npm publish
        run: npm publish --dry-run --tag ${{ steps.tag.outputs.tag }}
        env:
          AI_SDK_VERSION: v2
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
        env:
          AI_SDK_VERSION: v2
